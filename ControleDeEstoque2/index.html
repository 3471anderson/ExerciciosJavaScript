<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listando Produtos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      th[role="button"] {
        cursor: pointer;
        user-select: none;
      }
      th[role="button"]:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>

  <body>
    <div class="container-fluid p-0">
      <div class="row m-5">
        <div class="col-md-12 p-4 border border-2 border-secondary rounded-2">
          <div class="h1">Listando Produtos</div>
          <button class="btn btn-outline-danger btn-sm" onclick="limparTudo()">
            Limpar tudo
          </button>
          <hr />

          <div class="row mt-4">
            <div class="col-md-6">
              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="searchInput"
                  placeholder="Pesquisar"
                  oninput="renderizarTabela()"
                />
                <label for="searchInput">Pesquisar por nome, categoria.</label>
              </div>
            </div>
            <div class="col-md-6 d-flex align-items-center">
              <select
                class="form-select"
                id="searchCategory"
                onchange="renderizarTabela()"
              >
                <option value="">Todas as categorias</option>
                <option value="Laticinios">Laticínios</option>
                <option value="Produtos">Produtos</option>
                <option value="Carnes">Carnes</option>
                <option value="Limpadores">Limpadores</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
          </div>

          <div class="row g-2">
            <div class="col-md">
              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="itemName"
                  placeholder="item Name"
                />
                <label for="itemName">Nome do Item</label>
              </div>
            </div>

            <div class="col-md">
              <div class="form-floating">
                <input
                  type="number"
                  class="form-control"
                  id="totalQuantity"
                  placeholder="total quantity"
                  min="0"
                  step="1"
                />
                <label for="totalQuantity">Quantidade Total</label>
              </div>
            </div>

            <div class="col-md">
              <div class="input-group">
                <div class="form-floating">
                  <input
                    type="number"
                    class="form-control"
                    id="itemPrice"
                    placeholder="item price"
                    min="0"
                    step="0.01"
                  />
                  <label for="itemPrice">Preço/Quantidade</label>
                </div>
                <select
                  class="form-select"
                  id="itemCurrency"
                  aria-label="Moeda do preço"
                  style="max-width: 8.5rem"
                >
                  <option value="BRL" selected>R$ Real</option>
                  <option value="USD">US$ Dólar</option>
                </select>
              </div>
            </div>

            <div class="col-md">
              <div class="form-floating">
                <select class="form-select" id="itemCategory">
                  <option selected disabled></option>
                  <option disabled>-- Selecione qualquer um--</option>
                  <option value="Laticinios">Laticínios</option>
                  <option value="Produtos">Produtos</option>
                  <option value="Carnes">Carnes</option>
                  <option value="Limpadores">Limpadores</option>
                  <option value="Outro">Outro</option>
                </select>
                <label for="itemCategory">Categoria</label>
              </div>
            </div>

            <div class="col-md d-flex">
              <div class="d-flex gap-2">
                <button
                  class="btn btn-success form-control"
                  id="btnSalvar"
                  onclick="addItems()"
                >
                  Adicionar na loja
                </button>
                <button
                  class="btn btn-outline-secondary d-none"
                  id="btnCancelar"
                  onclick="cancelarEdicao()"
                >
                  Cancelar
                </button>
              </div>
            </div>
          </div>

          <div class="row mt-5">
            <div class="col-md-12">
              <div class="h1 text-decoration-underline">
                O total de itens dentro da loja
              </div>
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th role="button" onclick="ordenarPorColuna('id')">
                      Nu s. <span id="seta-id"></span>
                    </th>
                    <th role="button" onclick="ordenarPorColuna('nome')">
                      Nome do item <span id="seta-nome"></span>
                    </th>
                    <th role="button" onclick="ordenarPorColuna('quantidade')">
                      Quantidade do item <span id="seta-quantidade"></span>
                    </th>
                    <th role="button" onclick="ordenarPorColuna('preco')">
                      Preço do item <span id="seta-preco"></span>
                    </th>
                    <th role="button" onclick="ordenarPorColuna('categoria')">
                      Categoria <span id="seta-categoria"></span>
                    </th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="itemData"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
